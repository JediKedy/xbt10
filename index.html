<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XBT-10</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <style>
        [v-cloak] { display: none }
        /* Sadələşdirilmiş keçid animasiyası */
        .fade-enter-active { transition: opacity 0.2s ease; }
        .fade-enter-from { opacity: 0; }
        .glass { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 transition-colors">

<div id="app" v-cloak>
    <!-- Kopyalandı Bildirişi -->
    <div v-if="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] bg-indigo-600 text-white px-5 py-2 rounded-full shadow-xl text-sm">
        {{ toast }}
    </div>

    <!-- Header -->
    <nav class="fixed w-full z-50 top-0 bg-white/80 dark:bg-zinc-950/80 border-b border-zinc-200 dark:border-zinc-800 glass">
        <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
            <h1 class="font-black tracking-tighter text-indigo-600">XBT-10</h1>
            <button @click="toggleDark" class="p-2 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-lg">
                <span v-if="isDark">Gündüz rejim</span><span v-else>Tünd rejim</span>
            </button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 pt-20 pb-10">
        <!-- Axtarış -->
        <div class="sticky top-[70px] z-40 mb-6">
            <input
                v-model.trim="searchQuery"
                type="text"
                placeholder="Kod və ya diaqnoz..."
                class="w-full p-4 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl shadow-lg outline-none focus:border-indigo-500 transition-all"
            >
        </div>

        <!-- Yüklənir -->
        <div v-if="loading" class="text-center py-20 font-medium text-zinc-500">Baza yüklənir...</div>

        <!-- Siyahı -->
        <div class="space-y-3">
            <div v-for="(groups, category) in limitedData" :key="category" 
                 class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl overflow-hidden">
                
                <button @click="toggleMain(category)" 
                        class="w-full p-4 flex justify-between items-center hover:bg-zinc-50 dark:hover:bg-zinc-800/50 text-left font-bold text-sm">
                    {{ category }}
                    <span :class="{'rotate-180': openMain === category || query}" class="transition-transform opacity-30">▼</span>
                </button>

                <div v-show="openMain === category || query" class="px-4 pb-4 space-y-4 border-t border-zinc-100 dark:border-zinc-800">
                    <div v-for="(sub, groupCode) in groups" :key="groupCode" class="mt-4">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 text-[10px] px-1.5 py-0.5 rounded font-mono font-bold">{{ groupCode }}</span>
                            <span class="text-xs font-bold opacity-80">{{ sub.main.description }}</span>
                        </div>

                        <ul class="ml-2 pl-3 border-l-2 border-zinc-100 dark:border-zinc-800 space-y-2">
                            <li v-for="child in sub.children" :key="child.code" 
                                @click="copyToClipboard(child.code)"
                                class="text-sm cursor-pointer hover:text-indigo-600 transition-colors py-1 group">
                                <span class="font-mono font-bold text-indigo-500 mr-2">{{ child.code }}</span>
                                <span class="text-zinc-600 dark:text-zinc-400">{{ child.description }}</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <div v-if="Object.keys(filteredData).length === 0 && !loading" class="text-center py-20 text-zinc-400">
                Nəticə tapılmadı.
            </div>
        </div>
    </main>
</div>

<script>
const { createApp, ref, computed, watch, onMounted } = Vue;

createApp({
    setup() {
        const searchQuery = ref('');
        const query = ref('');
        const rawData = ref({});
        const loading = ref(true);
        const openMain = ref(null);
        const toast = ref(null);
        const isDark = ref(document.documentElement.classList.contains('dark'));

        // Donmanı önləyən axtarış (Debounce)
        let timeout;
        watch(searchQuery, (v) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => query.value = v.toLowerCase(), 200);
        });

        const toggleDark = () => {
            isDark.value = !isDark.value;
            document.documentElement.classList.toggle('dark', isDark.value);
            localStorage.setItem('theme', isDark.value ? 'dark' : 'light');
        };

        const copyToClipboard = (text) => {
            navigator.clipboard.writeText(text);
            toast.value = `${text} kopyalandı!`;
            setTimeout(() => toast.value = null, 1500);
        };

        const fetchData = async () => {
            try {
                const cached = localStorage.getItem('xbt_cache_v2');
                if (cached) {
                    rawData.value = Object.freeze(JSON.parse(cached));
                    loading.value = false;
                }
                const res = await fetch('data.json');
                const json = await res.json();
                const transformed = {};
                for (const [cat, items] of Object.entries(json.data)) {
                    const groups = {};
                    items.forEach(item => {
                        if (!item.code.includes('.')) {
                            groups[item.code] = { main: item, children: groups[item.code]?.children || [] };
                        } else {
                            const pCode = item.code.split('.')[0];
                            if (!groups[pCode]) groups[pCode] = { main: { code: pCode, description: pCode }, children: [] };
                            groups[pCode].children.push(item);
                        }
                    });
                    transformed[cat] = groups;
                }
                rawData.value = Object.freeze(transformed);
                localStorage.setItem('xbt_cache_v2', JSON.stringify(transformed));
            } catch (e) { console.error("Data error"); }
            finally { loading.value = false; }
        };

        // Əsas filtrasiya
        const filteredData = computed(() => {
            if (!query.value) return rawData.value;
            const q = query.value;
            const res = {};
            for (const [cat, groups] of Object.entries(rawData.value)) {
                const fGroups = {};
                for (const [gCode, group] of Object.entries(groups)) {
                    const mMatch = gCode.toLowerCase().includes(q) || group.main.description.toLowerCase().includes(q);
                    const fChildren = group.children.filter(c => c.code.toLowerCase().includes(q) || c.description.toLowerCase().includes(q));
                    if (mMatch || fChildren.length) {
                        fGroups[gCode] = { ...group, children: mMatch ? group.children : fChildren };
                    }
                }
                if (Object.keys(fGroups).length) res[cat] = fGroups;
            }
            return res;
        });

        // PERFORMANS ÜÇÜN: Nəticəni limitləmək (Donmanı həll edən əsas hissə)
        const limitedData = computed(() => {
            if (!query.value) return filteredData.value;
            const res = {};
            let count = 0;
            for (const [cat, groups] of Object.entries(filteredData.value)) {
                res[cat] = groups;
                count += Object.keys(groups).length;
                if (count > 50) break; // Cəmi 50 əsas qrup göstər (donmanı dərhal dayandırır)
            }
            return res;
        });

        const toggleMain = (cat) => openMain.value = openMain.value === cat ? null : cat;

        onMounted(fetchData);

        return { 
            searchQuery, query, loading, limitedData, filteredData, openMain, 
            isDark, toast, toggleDark, toggleMain, copyToClipboard 
        };
    }
}).mount('#app');
</script>
</body>
</html>

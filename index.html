<!DOCTYPE html>
<html lang="az" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XBT-10 | Rəqəmsal Klassifikasiya</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="app-icon-512x512.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script>
tailwind.config = {
  darkMode: 'class'
};

try {
  const stored = localStorage.getItem('theme');
  if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
} catch (_) {}
</script>

<style>
[v-cloak]{display:none}

/* LIGHTWEIGHT animation */
.acc-enter-active,
.acc-leave-active{
  transition: opacity .15s ease, transform .15s ease;
}
.acc-enter-from,
.acc-leave-to{
  opacity:0;
  transform:translateY(-4px);
}

.sr-only{
  position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;
}
</style>
</head>

<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100">

<div id="app" v-cloak>

<!-- NAV -->
<nav class="fixed w-full top-0 bg-white dark:bg-zinc-950 border-b">
<div class="max-w-4xl mx-auto px-6 h-16 flex justify-between items-center">

<h1 class="font-bold">XBT-10</h1>

<button @click="toggleDark" class="border px-3 py-1 rounded">
{{ isDark ? '☀️' : '🌙' }}
</button>

</div>
</nav>

<main class="max-w-4xl mx-auto px-6 pt-24 pb-16">

<!-- SEARCH -->
<input
v-model.trim="query"
placeholder="Kod və ya diaqnoz..."
class="w-full p-4 border rounded-xl mb-4"
/>

<p v-if="debouncedQuery" class="text-sm text-gray-500">
{{ resultCount }} nəticə
</p>

<!-- LOADING -->
<div v-if="loading">Yüklənir...</div>

<!-- ERROR -->
<div v-else-if="error">{{ error }}</div>

<!-- RESULTS -->
<div v-else>

<div v-for="(groups, category) in processedData" :key="category" class="mb-3 border rounded-xl">

<button @click="toggleMain(category)" class="w-full p-4 text-left font-semibold">
{{ category }}
</button>

<transition name="acc">
<div v-if="isMainOpen(category)" class="p-4">

<div v-for="(sub, groupCode) in groups" :key="groupCode" class="mb-2">

<button @click="toggleSub(groupCode)" class="text-left w-full text-sm font-bold">
{{ groupCode }} - {{ sub.main.description }}
</button>

<transition name="acc">
<ul v-if="isSubOpen(groupCode)" class="ml-4 mt-2">

<li v-for="child in sub.children" :key="child.code" class="text-sm">
{{ child.code }} - {{ child.description }}
</li>

</ul>
</transition>

</div>

</div>
</transition>

</div>

</div>

</main>
</div>

<!-- SERVICE WORKER -->
<script>
if ('serviceWorker' in navigator) {
  const SW = `
const CACHE = 'xbt10-v2';

self.addEventListener('install', e=>{
  self.skipWaiting();
  e.waitUntil(caches.open(CACHE));
});

self.addEventListener('fetch', e=>{
  if(e.request.method !== 'GET') return;

  e.respondWith(
    caches.match(e.request).then(res =>
      res || fetch(e.request).then(r=>{
        const clone = r.clone();
        caches.open(CACHE).then(c=>c.put(e.request, clone));
        return r;
      })
    )
  );
});
`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([SW])));
}
</script>

<!-- APP -->
<script>
const { createApp, ref, computed, watch, onMounted } = Vue;

const DATA_URL = 'https://raw.githubusercontent.com/JediKedy/xbt10/refs/heads/main/data.json';

function buildGroups(items){
  const groups={};
  for(const item of items){
    if(!item.code.includes('.')){
      groups[item.code] ??= { main:item, children:[] };
    }else{
      const p=item.code.split('.')[0];
      groups[p] ??= { main:{code:p,description:p}, children:[] };
      groups[p].children.push(item);
    }
  }
  return groups;
}

function transform(data){
  const out={};
  for(const [cat,items] of Object.entries(data)){
    out[cat]=buildGroups(items);
  }
  return out;
}

createApp({
setup(){

const query=ref('');
const debouncedQuery=ref('');
const rawData=ref(null);
const loading=ref(true);
const error=ref(null);
const open=ref({main:null,sub:null});
const isDark=ref(document.documentElement.classList.contains('dark'));

let timer;
watch(query,val=>{
  clearTimeout(timer);
  timer=setTimeout(()=>debouncedQuery.value=val,250);
});

/* DARK */
function toggleDark(){
  isDark.value=!isDark.value;
  document.documentElement.classList.toggle('dark');
}

/* FETCH */
async function fetchData(){
  try{
    const res=await fetch(DATA_URL);
    const json=await res.json();

    // ⚡ LOWERCASE CACHE
    for(const cat in json.data){
      json.data[cat]=json.data[cat].map(i=>({
        ...i,
        _code:i.code.toLowerCase(),
        _desc:i.description.toLowerCase()
      }));
    }

    rawData.value=json.data;
  }catch(e){
    error.value='Xəta baş verdi';
  }finally{
    loading.value=false;
  }
}

onMounted(fetchData);

/* COMPUTED */
const transformedData=computed(()=>rawData.value?transform(rawData.value):{});

const processedData=computed(()=>{
  const q=debouncedQuery.value.toLowerCase();
  if(!q) return transformedData.value;

  const filtered={};

  for(const [cat,items] of Object.entries(rawData.value)){
    const m=items.filter(i=>i._code.includes(q)||i._desc.includes(q));
    if(m.length) filtered[cat]=m;
  }

  return transform(filtered);
});

const resultCount=computed(()=>
  Object.values(processedData.value).reduce((t,g)=>
    t+Object.values(g).reduce((n,x)=>n+1+x.children.length,0),0)
);

/* UI */
const isSearching=()=>!!debouncedQuery.value;

function isMainOpen(c){return isSearching()||open.value.main===c;}
function isSubOpen(c){return isSearching()||open.value.sub===c;}

function toggleMain(c){
  if(isSearching())return;
  open.value=open.value.main===c?{main:null,sub:null}:{main:c,sub:null};
}

function toggleSub(c){
  if(isSearching())return;
  open.value={main:open.value.main,sub:open.value.sub===c?null:c};
}

return{
query,debouncedQuery,processedData,resultCount,
loading,error,
isMainOpen,isSubOpen,toggleMain,toggleSub,
toggleDark,isDark
};

}
}).mount('#app');
</script>

</body>
</html>

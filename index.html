<!DOCTYPE html>
<html lang="az" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XBT-10</title>
<meta name="application-name" content="XBT-10">
<meta name="description" content="XBT-10 Rəqəmsal Klassifikasiya — Ümumdünya Səhiyyə Təşkilatının standartlarına uyğun təsnifat.">
<meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1b4b" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="app-icon-512x512.png">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
  try {
    const stored = localStorage.getItem('theme');
    if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  } catch (_) {}
</script>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --bg-soft: #f8fafc;
    --bg-card: #ffffff;
    --bg-hover: #f1f5f9;
    --border: #e2e8f0;
    --border-soft: #f1f5f9;
    --text: #0f172a;
    --text-soft: #334155;
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    --accent: #4f46e5;
    --accent-bg: #eef2ff;
    --accent-border: #e0e7ff;
    --danger: #ef4444;
  }

  html.dark {
    --bg: #09090b;
    --bg-soft: #18181b;
    --bg-card: #18181b;
    --bg-hover: #27272a;
    --border: #27272a;
    --border-soft: #202023;
    --text: #f4f4f5;
    --text-soft: #d4d4d8;
    --text-muted: #71717a;
    --text-faint: #3f3f46;
    --accent: #818cf8;
    --accent-hover: #a5b4fc;
    --accent-bg: rgba(79, 70, 229, 0.15);
    --accent-border: rgba(129, 140, 248, 0.25);
  }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    transition: background-color .2s, color .2s;
    -webkit-tap-highlight-color: transparent;
  }

  [v-cloak] { display: none; }

  .wrap { max-width: 48rem; margin: 0 auto; padding: 0 1rem; }

  /* ── Navbar ── */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 56px;
    z-index: 1000;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: .5rem; }
  .brand-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent); }
  .brand h1 {
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin: 0;
  }

  .icon-btn {
    width: 2.25rem;
    height: 2.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: .5rem;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-soft);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-hover); }
  .icon-btn svg { width: 1.15rem; height: 1.15rem; }
  .icon-btn.sun svg { color: #facc15; }

  /* ── Main ── */
  main { padding-top: 4.5rem; padding-bottom: 4rem; }

  /* ── Axtarış Bölməsi (Search Block) ── */
  .search-block { margin-top: 5rem; margin-bottom: 1.5rem; }
  .search-field { position: relative; }

  .search-input {
    width: 100%;
    padding: 12px 14px;
    padding-right: 70px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: .5rem;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  .search-input:focus {
    border-color: var(--accent);
  }
  .search-input::placeholder { color: var(--text-muted); }

  .search-input::-webkit-search-cancel-button,
  .search-input::-webkit-search-decoration {
    -webkit-appearance: none;
    appearance: none;
  }

  .search-controls {
    position: absolute;
    right: .75rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .clear-btn {
    background: none;
    border: none;
    padding: .25rem;
    display: flex;
    color: var(--text-muted);
    cursor: pointer;
  }
  .clear-btn:hover { color: var(--text); }
  .clear-btn svg { width: 1.25rem; height: 1.25rem; }
  .divider { width: 1px; height: 1.25rem; background: var(--border); }
  .search-icon { width: 1.25rem; height: 1.25rem; color: var(--text-faint); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border-width: 0;
  }

  .result-count {
    margin: .5rem 0 0 .25rem;
    font-size: .8rem;
    font-weight: 500;
    color: var(--text-muted);
  }

  /* ── Statuslar ── */
  .center-block { display: flex; flex-direction: column; align-items: center; padding: 4rem 0; gap: 1rem; }
  .spinner {
    width: 1.75rem; height: 1.75rem;
    border: 3px solid var(--accent);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .muted-text { color: var(--text-muted); font-size: .9rem; }
  .error-block { text-align: center; padding: 4rem 0; }
  .error-text { color: var(--danger); font-weight: 600; font-size: .9rem; }
  .retry-btn { margin-top: .5rem; background: none; border: none; color: var(--accent); font-size: .85rem; cursor: pointer; text-decoration: underline; }
  .empty-block { padding: 4rem 0; text-align: center; color: var(--text-muted); font-size: .9rem; }

  /* ── Akkordeon Dizaynı ── */
  .category {
    margin-bottom: .5rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: .5rem;
    overflow: hidden;
  }

  .category-toggle {
    width: 100%;
    padding: .85rem 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .75rem;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
  }
  .category-toggle:hover { background: var(--bg-hover); }
  .category-toggle h2 {
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    margin: 0;
    font-size: .95rem;
  }
  .chevron {
    flex-shrink: 0;
    width: 1.15rem;
    height: 1.15rem;
    color: var(--text-faint);
    transition: transform .2s;
  }
  .chevron.open { transform: rotate(180deg); color: var(--accent); }

  .category-body { 
    padding: 0 1rem .5rem 1rem; 
    background: var(--bg-soft);
    border-top: 1px solid var(--border-soft);
  }

  /* ── Qruplar (Sub-groups) ── */
  .sub-group { 
    padding: .75rem 0;
  }
  .sub-group + .sub-group { 
    border-top: 1px solid var(--border-soft); 
  }

  .sub-toggle {
    display: flex;
    align-items: flex-start;
    gap: .5rem;
    text-align: left;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
  }
  
  /* Kliklənə və kopyalana bilən kod nişanları */
  .copyable-code {
    position: relative;
    flex-shrink: 0;
    background: var(--accent-bg);
    color: var(--accent);
    font-family: monospace;
    font-weight: 700;
    font-size: .75rem;
    padding: .25rem .5rem;
    border-radius: .375rem;
    cursor: copy;
    user-select: none;
    transition: opacity .15s;
    display: inline-flex;
    align-items: center;
  }
  .copyable-code:active {
    opacity: .6;
  }

  /* Kopyalandı Tooltip-i */
  .copyable-code::after {
    content: "Kopyalandı!";
    position: absolute;
    bottom: 125%;
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    font-weight: normal;
    font-size: .7rem;
    padding: .2rem .4rem;
    border-radius: .25rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s, transform .15s;
    white-space: nowrap;
    z-index: 10;
  }
  .copyable-code.copied::after {
    opacity: 0.9;
    transform: translateX(-50%) scale(1);
  }

  .sub-desc {
    font-size: .875rem;
    font-weight: 500;
    color: var(--text-soft);
    padding-top: .15rem;
  }

  /* ── Alt Elementlər (Children) ── */
  .children {
    margin: .5rem 0 0 .5rem;
    padding-left: .75rem;
    border-left: 2px solid var(--border);
    list-style: none;
  }
  .children li {
    display: flex;
    align-items: flex-start;
    gap: .5rem;
    padding: .4rem 0;
  }
  .child-desc {
    color: var(--text-muted);
    font-size: .85rem;
    line-height: 1.4;
    padding-top: .15rem;
  }

  /* ── Keçid Animasiyaları ── */
  .acc-enter-active, .acc-leave-active { transition: opacity .15s ease; }
  .acc-enter-from, .acc-leave-to { opacity: 0; }

  /* ── Footer ── */
  footer {
    max-width: 48rem;
    margin: 0 auto;
    padding: 2rem 1rem;
    border-top: 1px solid var(--border);
    font-size: .7rem;
    color: var(--text-muted);
    text-align: center;
  }
</style>
</head>
<body>

<div id="app" v-cloak>

  <!-- ── Navbar ── -->
  <nav class="nav">
    <div class="wrap nav-inner">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1>XBT-10</h1>
      </div>

      <button
        @click="toggleDark"
        :aria-label="isDark ? 'İşıqlı rejimə keç' : 'Qaranlıq rejimə keç'"
        class="icon-btn" :class="{ sun: isDark }">
        <svg v-if="isDark" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0Z"/>
        </svg>
        <svg v-else fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998Z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- ── Əsas Məzmun (Main) ── -->
  <main class="wrap">

    <!--Canlı Axtarış Bölməsi (Search) -->
    <div class="search-block">
      <div class="search-field">
        <label for="searchInput" class="sr-only">Kod və ya diaqnoz axtar</label>
        <input
          id="searchInput"
          v-model.trim="query"
          type="search"
          autocomplete="off"
          placeholder="Kod və ya diaqnoz axtar..."
          class="search-input"
        >
        <div class="search-controls" aria-hidden="true">
          <button
            v-if="query"
            @click="query = ''"
            aria-label="Axtarışı sil"
            class="clear-btn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
          <div class="divider"></div>
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <p aria-live="polite" aria-atomic="true" class="sr-only">
        {{ debouncedQuery ? `${resultCount} nəticə tapıldı` : '' }}
      </p>

      <p v-if="debouncedQuery" class="result-count">
        Axtarış nəticəsi: {{ resultCount }} nəticə tapıldı.
      </p>
    </div>

    <!-- Yüklənir vəziyyəti -->
    <div v-if="loading" class="center-block" role="status" aria-label="Yüklənir">
      <div class="spinner"></div>
      <p class="muted-text">Məlumat bazası yenilənir...</p>
    </div>

    <!-- Xəta vəziyyəti -->
    <div v-else-if="error" class="error-block" role="alert">
      <p class="error-text">{{ error }}</p>
      <button @click="fetchData" class="retry-btn">Yenidən cəhd et</button>
    </div>

    <!-- Dinamik Məlumat Listi (Akkordeonlar) -->
    <template v-else>
      <div
        v-for="(groups, category) in processedData"
        :key="category"
        class="category">

        <!-- Kateqoriya Düyməsi -->
        <button
          type="button"
          @click="toggleMain(category)"
          :aria-expanded="isMainOpen(category)"
          :aria-controls="`cat-${category}`"
          class="category-toggle">
          <h2>{{ category }}</h2>
          <svg
            class="chevron" :class="{ open: isMainOpen(category) }"
            fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- Kateqoriya İçindəki Qruplar -->
        <transition name="acc">
          <div v-if="isMainOpen(category)" :id="`cat-${category}`" class="category-body">
            <div
              v-for="(sub, groupCode) in groups"
              :key="groupCode"
              class="sub-group">

              <!-- Qrup Başlığı və Klikləmə sahələri -->
              <div class="sub-toggle">
                <!-- Koda vuranda kopyalayır -->
                <span class="copyable-code" title="Kopyalamaq üçün klikləyin" @click="copyText($event, groupCode, sub.main.description)">{{ groupCode }}</span>
                <!-- Diaqnozun adına vuranda akkordeon alt menyunu açır -->
                <span class="sub-desc" @click="toggleSub(groupCode)" style="cursor:pointer; flex-grow:1; user-select:none;">{{ sub.main.description }}</span>
              </div>

              <!-- Alt Diaqnoz Elementləri (Children) -->
              <transition name="acc">
                <ul v-if="isSubOpen(groupCode) && sub.children.length" :id="`sub-${groupCode}`" class="children">
                  <li v-for="child in sub.children" :key="child.code">
                    <!-- Koda vuranda kopyalayır -->
                    <span class="copyable-code" title="Kopyalamaq üçün klikləyin" @click="copyText($event, child.code, child.description)">{{ child.code }}</span>
                    <span class="child-desc">{{ child.description }}</span>
                  </li>
                </ul>
              </transition>
            </div>
          </div>
        </transition>
      </div>

      <!-- Boş Nəticə Vəziyyəti -->
      <div v-if="resultCount === 0 && debouncedQuery" class="empty-block">
        Nəticə tapılmadı.
      </div>
    </template>
  </main>

  <footer>
    <p>© 2026 JediKedy | Ümumdünya Səhiyyə Təşkilatının standartlarına uyğun təsnifat.</p>
  </footer>
</div>

<!-- ── Vue Proqram Məntiqi ── -->
<script>
const { createApp, ref, computed, watch, onMounted, shallowRef } = Vue;

const DATA_URL = 'https://raw.githubusercontent.com/JediKedy/xbt10/refs/heads/main/data.json';

function buildGroups(items) {
  const groups = Object.create(null);
  for (const item of items) {
    const dot = item.code.indexOf('.');
    if (dot === -1) {
      if (groups[item.code]) {
        groups[item.code].main = item;
      } else {
        groups[item.code] = { main: item, children: [] };
      }
    } else {
      const parent = item.code.slice(0, dot);
      if (!groups[parent]) {
        groups[parent] = { main: { code: parent, description: parent }, children: [] };
      }
      groups[parent].children.push(item);
    }
  }
  return groups;
}

function transform(data) {
  const out = Object.create(null);
  for (const cat in data) {
    out[cat] = buildGroups(data[cat]);
  }
  return out;
}

function buildSearchIndex(data) {
  const index = Object.create(null);
  for (const cat in data) {
    index[cat] = data[cat].map(item => ({
      item,
      key: (item.code + ' ' + item.description).toLowerCase()
    }));
  }
  return index;
}

function filterAndGroup(index, q) {
  const out = Object.create(null);
  for (const cat in index) {
    const entries = index[cat];
    const matched = [];
    for (let i = 0; i < entries.length; i++) {
      if (entries[i].key.includes(q)) matched.push(entries[i].item);
    }
    if (matched.length) out[cat] = buildGroups(matched);
  }
  return out;
}

createApp({
  setup() {
    const query          = ref('');
    const debouncedQuery = ref('');
    const rawData        = shallowRef(null);
    const searchIndex    = shallowRef(null);
    const loading        = ref(true);
    const error          = ref(null);

    const openMain = ref(null);
    const openSub  = ref(null);

    const isDark = ref(document.documentElement.classList.contains('dark'));

    let debounceTimer;
    watch(query, val => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        debouncedQuery.value = val.toLowerCase();
      }, 200);
    });

    function toggleDark() {
      isDark.value = !isDark.value;
      document.documentElement.classList.toggle('dark', isDark.value);
      try { localStorage.setItem('theme', isDark.value ? 'dark' : 'light'); } catch (_) {}
    }

    async function fetchData() {
      loading.value = true;
      error.value   = null;
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const data = Object.freeze(json.data ?? {});
        rawData.value     = data;
        searchIndex.value = buildSearchIndex(data);
      } catch (e) {
        console.error('Fetch failed:', e);
        error.value = 'Məlumat bazası yüklənmədi. Yenidən cəhd edin.';
      } finally {
        loading.value = false;
      }
    }

    onMounted(fetchData);

    const transformedData = computed(() => {
      if (!rawData.value) return {};
      return transform(rawData.value);
    });

    // Axtarış və Filtrləmə mexanizmi buradadır
    const processedData = computed(() => {
      const q = debouncedQuery.value;
      if (!q) return transformedData.value;
      if (!searchIndex.value) return {};
      return filterAndGroup(searchIndex.value, q);
    });

    const resultCount = computed(() =>
      Object.values(processedData.value).reduce((total, groups) =>
        total + Object.values(groups).reduce((n, g) => n + 1 + g.children.length, 0),
      0)
    );

    const isSearching = () => !!debouncedQuery.value;

    function isMainOpen(cat)  { return isSearching() || openMain.value === cat; }
    function isSubOpen(code)  { return isSearching() || openSub.value   === code; }

    function toggleMain(cat) {
      if (isSearching()) return;
      if (openMain.value === cat) {
        openMain.value = null;
        openSub.value  = null;
      } else {
        openMain.value = cat;
        openSub.value  = null;
      }
    }

    function toggleSub(code) {
      if (isSearching()) return;
      openSub.value = openSub.value === code ? null : code;
    }

    // Pano API vasitəsilə mətni kopyalama funksiyası
    function copyText(event, code, desc) {
      const fullText = `${code} ${desc}`;
      navigator.clipboard.writeText(fullText).then(() => {
        const el = event.currentTarget;
        el.classList.add('copied');
        setTimeout(() => {
          el.classList.remove('copied');
        }, 1000);
      }).catch(err => {
        console.error('Kopyalama xətası:', err);
      });
    }

    return {
      query, debouncedQuery, processedData, resultCount,
      loading, error, fetchData,
      isMainOpen, isSubOpen, toggleMain, toggleSub,
      isDark, toggleDark, copyText
    };
  }
}).mount('#app');
</script>
</body>
</html>
